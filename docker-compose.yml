version: '3.8'

services:
  # ==========================================
  # PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: auth_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # Express Backend API Service
  # ==========================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: auth_api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/auth_db?schema=public
      FRONTEND_URL: http://localhost:5173
      JWT_ACCESS_SECRET: prod_super_secret_jwt_access_token_key_998877665544
      JWT_REFRESH_SECRET: prod_super_secret_jwt_refresh_token_key_112233445566
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION_DAYS: 7
      JWT_REFRESH_REMEMBER_ME_DAYS: 30
      PASSWORD_RESET_EXPIRATION_MINUTES: 60
    depends_on:
      postgres:
        condition: service_healthy

  # ==========================================
  # React + Vite Web Client Service
  # ==========================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: auth_web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:

